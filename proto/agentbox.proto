syntax = "proto3";

option go_package = "github.com/AnandRaj2224/agentbox/internal/api";

message ExecuteRequest {
    string sourceCode = 1;
    string runtime = 2;
}

message ExecuteResponse {
    string output = 1;
    int32 exitCode = 2;
}

service ExecutionService {
    rpc Execute (ExecuteRequest) returns (ExecuteResponse);
}
